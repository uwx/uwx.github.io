<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1838"/>
      <stop offset="1" stop-color="#140c1d"/>
    </linearGradient>
    <radialGradient id="glowPink"><stop offset="0" stop-color="#ff5fa8" stop-opacity=".35"/><stop offset="1" stop-color="#ff5fa8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#7fd8ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowYellow"><stop offset="0" stop-color="#ffe45c" stop-opacity=".22"/><stop offset="1" stop-color="#ffe45c" stop-opacity="0"/></radialGradient>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5fa8"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7fd8ff"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="320" cy="450" r="420" fill="url(#glowPink)"/>
  <circle cx="1280" cy="450" r="420" fill="url(#glowBlue)"/>
  <circle cx="800" cy="450" r="300" fill="url(#glowYellow)"/>

  <!-- Alice's editor -->
  <g>
    <rect x="80" y="220" width="480" height="460" rx="20" fill="#2a1a38" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M80 276H560" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="116" cy="248" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="142" cy="248" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="168" cy="248" r="8" fill="#ffffff" fill-opacity=".25"/>
    <text x="524" y="256" text-anchor="end" font-size="28" font-weight="700" fill="#ff5fa8">Alice</text>

    <rect x="116" y="374" width="184" height="26" rx="4" fill="#7fd8ff" fill-opacity=".25"/>
    <g fill="#ffffff" fill-opacity=".28">
      <rect x="116" y="316" width="380" height="14" rx="7"/><rect x="116" y="348" width="320" height="14" rx="7"/>
      <rect x="116" y="380" width="410" height="14" rx="7"/><rect x="116" y="412" width="250" height="14" rx="7"/>
      <rect x="116" y="444" width="360" height="14" rx="7"/><rect x="116" y="476" width="300" height="14" rx="7"/>
      <rect x="116" y="508" width="390" height="14" rx="7"/><rect x="116" y="540" width="220" height="14" rx="7"/>
    </g>
    <!-- Alice's own caret -->
    <rect x="366" y="432" width="3" height="30" rx="1.5" fill="#ff5fa8"/>
    <!-- Bob's remote cursor -->
    <rect x="300" y="370" width="3" height="34" rx="1.5" fill="#7fd8ff"/>
    <rect x="300" y="340" width="62" height="26" rx="6" fill="#7fd8ff"/>
    <text x="331" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#10202a">Bob</text>
  </g>

  <!-- Bob's editor -->
  <g>
    <rect x="1040" y="220" width="480" height="460" rx="20" fill="#2a1a38" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M1040 276H1520" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="1076" cy="248" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="1102" cy="248" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="1128" cy="248" r="8" fill="#ffffff" fill-opacity=".25"/>
    <text x="1484" y="256" text-anchor="end" font-size="28" font-weight="700" fill="#7fd8ff">Bob</text>

    <rect x="1076" y="438" width="184" height="26" rx="4" fill="#ff5fa8" fill-opacity=".25"/>
    <g fill="#ffffff" fill-opacity=".28">
      <rect x="1076" y="316" width="380" height="14" rx="7"/><rect x="1076" y="348" width="320" height="14" rx="7"/>
      <rect x="1076" y="380" width="410" height="14" rx="7"/><rect x="1076" y="412" width="250" height="14" rx="7"/>
      <rect x="1076" y="444" width="360" height="14" rx="7"/><rect x="1076" y="476" width="300" height="14" rx="7"/>
      <rect x="1076" y="508" width="390" height="14" rx="7"/><rect x="1076" y="540" width="220" height="14" rx="7"/>
    </g>
    <!-- Bob's own caret -->
    <rect x="1330" y="370" width="3" height="34" rx="1.5" fill="#7fd8ff"/>
    <!-- Alice's remote cursor -->
    <rect x="1260" y="434" width="3" height="34" rx="1.5" fill="#ff5fa8"/>
    <rect x="1260" y="404" width="76" height="26" rx="6" fill="#ff5fa8"/>
    <text x="1298" y="424" text-anchor="middle" font-size="20" font-weight="700" fill="#2a0a1a">Alice</text>
  </g>

  <!-- PDS -->
  <g>
    <rect x="660" y="290" width="280" height="320" rx="28" fill="#2a1a38" stroke="#ffe45c" stroke-width="3"/>
    <text x="800" y="348" text-anchor="middle" font-size="50" font-weight="800" fill="#ffe45c">PDS</text>
    <text x="800" y="384" text-anchor="middle" font-size="26" fill="#ffffff" fill-opacity=".7">AT Protocol</text>
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="22" fill="#ffffff" fill-opacity=".8">
      <rect x="690" y="410" width="220" height="44" rx="10" fill="#ffffff" fill-opacity=".08" stroke="#ffe45c" stroke-opacity=".35" stroke-width="2"/>
      <text x="708" y="438">update · #41</text>
      <rect x="690" y="470" width="220" height="44" rx="10" fill="#ffffff" fill-opacity=".08" stroke="#ffe45c" stroke-opacity=".35" stroke-width="2"/>
      <text x="708" y="498">update · #42</text>
      <rect x="690" y="530" width="220" height="44" rx="10" fill="#ffe45c" fill-opacity=".2" stroke="#ffe45c" stroke-opacity=".7" stroke-width="2"/>
      <text x="708" y="558">update · #43</text>
    </g>
  </g>

  <!-- Sync arrows -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M572 430H648" stroke="#ff5fa8" marker-end="url(#arrowPink)"/>
    <path d="M648 510H572" stroke="#7fd8ff" marker-end="url(#arrowBlue)"/>
    <path d="M1028 430H952" stroke="#7fd8ff" marker-end="url(#arrowBlue)"/>
    <path d="M952 510H1028" stroke="#ff5fa8" marker-end="url(#arrowPink)"/>
  </g>

  <text x="800" y="758" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff" fill-opacity=".92">Yjs CRDT  ⇄  AT Protocol records</text>
  <text x="800" y="812" text-anchor="middle" font-size="28" fill="#ffffff" fill-opacity=".6">multiplayer documents with your PDS as the transport</text>
</svg>
