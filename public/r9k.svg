    <circle cx="96" cy="178" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="122" cy="178" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="148" cy="178" r="8" fill="#ffffff" fill-opacity=".25"/>
    <text x="464" y="186" text-anchor="end" font-size="28" font-weight="700" fill="#ffffff">Firehose</text>
