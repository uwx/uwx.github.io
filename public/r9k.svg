    <path d="M1100 206H1540" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="1136" cy="178" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="1162" cy="178" r="8" fill="#ffffff" fill-opacity=".25"/><circle cx="1188" cy="178" r="8" fill="#ffffff" fill-opacity=".25"/>
