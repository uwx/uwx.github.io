    <rect x="166" y="598" width="150" height="14" rx="7" fill="#ffffff" fill-opacity=".34"/>
    <rect x="166" y="624" width="170" height="14" rx="7" fill="#ffffff" fill-opacity=".2"/>
    <rect x="386" y="584" width="64" height="64" rx="12" fill="url(#thumb)"/>
    <circle cx="430" cy="604" r="7" fill="#ffffff" fill-opacity=".7"/>
    <path d="M390 640L410 614L424 630L434 620L446 640Z" fill="#ffffff" fill-opacity=".55"/>
    <rect x="382" y="554" width="74" height="30" rx="15" fill="#241530" stroke="#ff5fa8" stroke-width="2"/>
    <text x="419.0" y="575" text-anchor="middle" font-size="18" font-weight="700" fill="#ff5fa8">seen</text>
