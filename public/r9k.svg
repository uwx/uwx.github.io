    <rect x="382" y="330" width="74" height="30" rx="15" fill="#241530" stroke="#ff5fa8" stroke-width="2"/>
    <text x="419.0" y="351" text-anchor="middle" font-size="18" font-weight="700" fill="#ff5fa8">seen</text>
    <rect x="90" y="456" width="380" height="96" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#7fd8ff" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="128" cy="504" r="22" fill="#ffe45c"/>
    <rect x="166" y="486" width="150" height="14" rx="7" fill="#ffffff" fill-opacity=".34"/>
    <rect x="166" y="512" width="170" height="14" rx="7" fill="#ffffff" fill-opacity=".2"/>
    <rect x="386" y="472" width="64" height="64" rx="12" fill="url(#thumb)"/>
    <circle cx="430" cy="492" r="7" fill="#ffffff" fill-opacity=".7"/>
    <path d="M390 528L410 502L424 518L434 508L446 528Z" fill="#ffffff" fill-opacity=".55"/>
    <rect x="382" y="442" width="74" height="30" rx="15" fill="#241530" stroke="#7fd8ff" stroke-width="2"/>
    <text x="419.0" y="463" text-anchor="middle" font-size="18" font-weight="700" fill="#7fd8ff">new</text>
