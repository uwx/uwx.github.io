    <rect x="732" y="440" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <rect x="768" y="440" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <rect x="804" y="440" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="840" y="440" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="876" y="440" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <rect x="912" y="440" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="660" y="484" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="696" y="484" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <rect x="732" y="484" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="768" y="484" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="804" y="484" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <rect x="840" y="484" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <rect x="876" y="484" width="28" height="28" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="912" y="484" width="28" height="28" rx="7" fill="#ffe45c" fill-opacity="0.85"/>
    <text x="800" y="545" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity=".6">seen before?</text>
  </g>

  <!-- Flow -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M512 400H628" stroke="#ffffff" stroke-opacity=".8" marker-end="url(#arrowWhite)"/>
    <path d="M972 400H1088" stroke="#7fd8ff" marker-end="url(#arrowBlue)"/>
    <path d="M800 592V648" stroke="#ff5fa8" marker-end="url(#arrowPink)"/>
  </g>
  <text x="800" y="684" text-anchor="middle" font-size="24" font-weight="700" fill="#ff5fa8">duplicates dropped</text>
  <text x="1030" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#7fd8ff">unique</text>

  <text x="800" y="768" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff" fill-opacity=".92">Seen it? Dropped.</text>
  <text x="800" y="818" text-anchor="middle" font-size="28" fill="#ffffff" fill-opacity=".6">a Bloom filter over text and image hashes keeps only unique posts</text>
